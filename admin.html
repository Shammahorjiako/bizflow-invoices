<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a130e"><title>BizFlow · Admin</title><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet"><style>:root{--bg:#0a130e;--card:rgba(22,38,29,.74);--line:rgba(120,190,150,.17);--g:#3ddc97;--g2:#1f9d6b;--gold:#f4c95d;--tx:#eaf3ed;--mu:#8ba897}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{background:var(--bg)}
body{margin:0;color:var(--tx);font:14px/1.55 'IBM Plex Mono',ui-monospace,monospace;min-height:100vh}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(120% 80% at 50% -10%,#15352a,var(--bg) 62%)}
.bg i{position:absolute;border-radius:50%;filter:blur(64px);opacity:.5;animation:drift 20s ease-in-out infinite alternate}
.bg i:nth-child(1){width:46vmax;height:46vmax;left:-14vmax;top:-12vmax;background:#1f9d6b}
.bg i:nth-child(2){width:38vmax;height:38vmax;right:-16vmax;top:28vh;background:#6a3fd6;animation-duration:26s;opacity:.4}
.bg i:nth-child(3){width:34vmax;height:34vmax;left:6vw;bottom:-18vmax;background:#c9a227;opacity:.25;animation-duration:23s}
.bg:after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:40px 40px;-webkit-mask-image:radial-gradient(circle at 50% 25%,#000,transparent 72%);mask-image:radial-gradient(circle at 50% 25%,#000,transparent 72%)}
.sp{position:absolute;bottom:-12px;border-radius:50%;background:var(--g);opacity:0;animation:rise linear infinite}
@keyframes drift{to{transform:translate(9vmax,7vmax) scale(1.18)}}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.7}100%{transform:translateY(-105vh);opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
@keyframes shine{to{transform:translateX(260%) skewX(-20deg)}}
@keyframes glow{0%,100%{box-shadow:0 6px 22px rgba(61,220,151,.28)}50%{box-shadow:0 6px 34px rgba(61,220,151,.6)}}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.w{max-width:560px;margin:0 auto;padding:16px 16px 90px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.top a{color:var(--g);text-decoration:none;font-size:13px}
.chip{padding:5px 12px;border-radius:99px;background:rgba(61,220,151,.12);border:1px solid var(--line);color:var(--g);font-size:12px}
h1{font:700 34px/1.1 Fraunces,Georgia,serif;margin:14px 0 6px;background:linear-gradient(100deg,#fff 20%,var(--g) 60%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mu);margin:0 0 20px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.28);animation:up .6s both;animation-delay:calc(var(--i,0)*90ms)}
h2{display:flex;align-items:center;gap:10px;margin:0 0 14px;font:600 13px 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}
.n{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--g),var(--g2));color:#06180f;font-weight:700;font-size:12px;letter-spacing:0}
.btn{position:relative;overflow:hidden;display:block;width:100%;border:0;border-radius:13px;padding:14px 18px;background:linear-gradient(135deg,var(--g),var(--g2));color:#05170e;font:700 14px 'IBM Plex Mono',ui-monospace,monospace;cursor:pointer;text-align:center;text-decoration:none;transition:transform .15s,filter .2s}
.btn:hover{filter:brightness(1.08);transform:translateY(-2px)}.btn:active{transform:scale(.97)}
.btn:after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:shine 3.4s ease-in-out infinite}
.btn.pulse{animation:glow 2.4s ease-in-out infinite}
.btn.g{background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--tx)}.btn.g:after{display:none}
.btn.s{display:inline-block;width:auto;padding:9px 14px;font-size:12px;border-radius:10px}
.btn.r{background:rgba(255,90,80,.16);border:1px solid rgba(255,110,100,.35);color:#ff9b94}.btn.r:after{display:none}
.btn:disabled{opacity:.4;pointer-events:none}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:rp .6s ease-out;pointer-events:none}@keyframes rp{to{transform:scale(3);opacity:0}}
input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.28);color:var(--tx);font:inherit;outline:0;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(61,220,151,.18)}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:linear-gradient(135deg,var(--g),var(--g2));color:#05170e;font-weight:700;padding:11px 18px;border-radius:99px;opacity:0;transition:.3s;pointer-events:none;z-index:9}.toast.on{opacity:1;transform:translate(-50%,0)}
.demo{position:fixed;top:0;left:0;right:0;text-align:center;font-size:11px;padding:3px;background:rgba(244,201,93,.14);color:var(--gold);z-index:8}
.cf{position:fixed;left:50%;top:60%;width:8px;height:12px;border-radius:2px;pointer-events:none;z-index:10;animation:cf 1.3s ease-out forwards}@keyframes cf{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}

.w{max-width:860px;padding-top:30px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:14px}@media(min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{border-radius:16px;padding:14px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(14px);animation:up .6s both;animation-delay:calc(var(--i)*80ms)}
.stat i{font-style:normal;font-size:20px}.stat b{display:block;font:700 26px Fraunces,Georgia,serif;margin-top:4px}.stat span{color:var(--mu);font-size:11px}
.tabs{display:flex;gap:6px;padding:5px;border-radius:14px;background:rgba(0,0,0,.4);border:1px solid var(--line);margin-bottom:14px;position:sticky;top:24px;z-index:5;backdrop-filter:blur(10px)}
.tabs button{flex:1;border:0;border-radius:10px;padding:10px 6px;background:transparent;color:var(--mu);font:600 12.5px 'IBM Plex Mono',ui-monospace,monospace;cursor:pointer;transition:.25s}.tabs button.on{background:linear-gradient(135deg,var(--g),var(--g2));color:#05170e}
.tabs em{font-style:normal;background:rgba(255,255,255,.18);border-radius:99px;padding:1px 7px;margin-left:4px;font-size:11px}
.it{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);animation:up .4s both}.it:last-child{border:0}
.av{width:42px;height:42px;flex:none;border-radius:13px;display:grid;place-items:center;font-weight:700;background:linear-gradient(135deg,rgba(61,220,151,.25),rgba(106,63,214,.25))}
.it .m{flex:1;min-width:0}.it .m b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.it small{color:var(--mu);display:block}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.1);margin:6px 0;overflow:hidden}.bar u{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--g),var(--gold))}
.st{padding:3px 10px;border-radius:99px;font-size:11px;font-weight:600;background:rgba(61,220,151,.15);color:var(--g)}.st.x{background:rgba(255,110,100,.15);color:#ff9b94}
.it .m b{white-space:normal}.it small{overflow-wrap:anywhere}@media(max-width:600px){.it{flex-wrap:wrap}.it .m{flex:1 1 calc(100% - 60px)}.it .acts{flex:1 1 100%}.it .acts .btn{flex:1}}
.empty{text-align:center;color:var(--mu);padding:26px 0}.sr{display:flex;gap:8px;margin-bottom:6px}.sr input{flex:1;min-width:0;width:auto}.sr .btn{flex:none}.sr .btn{width:auto;white-space:nowrap}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .3s}.sheet.on{opacity:1;pointer-events:auto}
.sh{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:#10211a;border:1px solid var(--line);border-radius:24px 24px 0 0;padding:20px 18px 24px;transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.9,.3,1)}.sheet.on .sh{transform:none}
.sh:before{content:"";display:block;width:44px;height:4px;border-radius:9px;background:rgba(255,255,255,.2);margin:-8px auto 14px}.sh h3{margin:0 0 4px;font:700 22px Fraunces,Georgia,serif}.sh p{margin:0 0 14px;color:var(--mu)}
.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}.apps a{display:block;text-align:center;text-decoration:none;color:var(--tx);padding:14px 6px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:12px;transition:transform .15s,border-color .2s;animation:up .4s both}.apps a:hover{border-color:var(--g)}.apps a:active{transform:scale(.95)}.apps i{display:grid;place-items:center;width:46px;height:46px;margin:0 auto 8px;border-radius:14px;font:700 20px Fraunces,Georgia,serif;font-style:normal;color:#fff}
.sh label{display:block;font-size:12px;color:var(--mu);margin-bottom:6px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}.chips button{border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--tx);border-radius:99px;padding:6px 13px;font:inherit;font-size:12px;cursor:pointer}.chips button:hover{border-color:var(--g);color:var(--g)}</style><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="shared.js"></script></head><body><div class="bg"><i></i><i></i><i></i></div><div class="w"><div class="top"><a href="index.html">← Invoices</a><span class="chip">👑 Admin</span></div>
<h1>Control room</h1><p class="sub">Payments, accounts and plans at a glance.</p>
<div class="stats" id="stats"></div>
<div class="tabs" id="tabs"><button data-t="pay" class="on">Payments<em id="pc">0</em></button><button data-t="acc">Accounts</button><button data-t="his">History</button></div>
<div class="card" style="--i:1" id="v"></div></div>
<div class="sheet" id="md"><div class="sh"><h3 id="mt"></h3><p id="ms"></p><label>Receipts to give this user</label><input id="mi" type="number" min="1"><div class="chips" id="mc"></div><button class="btn" id="mok">Confirm</button><button class="btn g" id="mx" style="margin-top:8px">Cancel</button></div></div>
<script>const $=i=>document.getElementById(i),naira=n=>'₦'+Number(n||0).toLocaleString('en-NG');
(function(){const b=document.querySelector('.bg');for(let i=0;i<14;i++){const s=document.createElement('span');s.className='sp';const z=2+Math.random()*4;s.style.cssText=`left:${Math.random()*100}%;width:${z}px;height:${z}px;animation-duration:${9+Math.random()*10}s;animation-delay:${-Math.random()*14}s`;b.appendChild(s);}})();
document.addEventListener('pointerdown',e=>{const b=e.target.closest('.btn');if(!b)return;const r=b.getBoundingClientRect(),s=document.createElement('span'),d=Math.max(r.width,r.height);s.className='rip';s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;b.appendChild(s);setTimeout(()=>s.remove(),600);});
function toast(m){let t=$('toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t);}t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),1900);}
function countUp(el,to,fmt=v=>v,ms=900){const t0=performance.now(),from=0;(function f(n){const k=Math.min(1,(n-t0)/ms),e=1-Math.pow(1-k,3);el.textContent=fmt(Math.round(from+(to-from)*e));if(k<1)requestAnimationFrame(f);})(t0);}
function confetti(){const c=['#3ddc97','#f4c95d','#8f6bff','#fff'];for(let i=0;i<34;i++){const e=document.createElement('i');e.className='cf';e.style.cssText=`background:${c[i%4]};--x:${(Math.random()-.5)*340}px;--y:${-120-Math.random()*240}px;--r:${Math.random()*720}deg`;document.body.appendChild(e);setTimeout(()=>e.remove(),1400);}}

BF.init();
const ts=()=>firebase.firestore.FieldValue.serverTimestamp(),inc=firebase.firestore.FieldValue.increment;
let users=[],pays=[],tab='pay',q='',cb;
const ago=t=>{if(!t||!t.toMillis)return 'just now';const m=Math.round((Date.now()-t.toMillis())/6e4);return m<1?'just now':m<60?m+'m ago':m<1440?Math.round(m/60)+'h ago':Math.round(m/1440)+'d ago';};
const ini=e=>(e||'?')[0].toUpperCase(),nm=e=>(e||'').split('@')[0],sug=p=>Math.floor((p.amount||0)/BF.PER);
BF.auth.onAuthStateChanged(u=>{
 if(!u||u.email!==BF.ADMIN){document.body.innerHTML='<div style="padding:40px;font:16px monospace;color:#8ba897">404 · Page not found</div>';return;}
 if(!u.emailVerified){$('tabs').style.display='none';$('v').innerHTML='<h2>Verify your email</h2><p class="muted">Admin tools only unlock for a verified email.</p><button class="btn" id="vb">Send verification email</button><button class="btn g" id="vd" style="margin-top:8px">I\'ve verified, continue</button>';
  $('vb').onclick=()=>u.sendEmailVerification().then(()=>toast('Verification email sent'),()=>toast('Try again in a minute'));$('vd').onclick=async()=>{await u.reload();await u.getIdToken(true);location.reload();};return;}
 BF.db.collection('users').orderBy('createdAt','desc').limit(500).onSnapshot(s=>{users=s.docs.map(d=>({id:d.id,...d.data()}));stats();draw();},e=>toast('Users: '+e.code));
 BF.db.collection('payments').orderBy('createdAt','desc').limit(200).onSnapshot(s=>{pays=s.docs.map(d=>({id:d.id,...d.data()}));stats();draw();},e=>toast('Payments: '+e.code));});
let first=true;
function stats(){const ap=pays.filter(p=>p.status=='approved'),pe=pays.filter(p=>p.status=='pending'),nw=users.filter(x=>x.createdAt&&x.createdAt.toMillis&&Date.now()-x.createdAt.toMillis()<864e5).length;
 const S=[['👥',users.length,'accounts',v=>v],['✨',nw,'new in 24h',v=>v],['⏳',pe.length,'pending',v=>v],['💰',ap.reduce((s,p)=>s+(p.amount||0),0),'revenue',naira]];
 $('stats').innerHTML=S.map((x,i)=>`<div class="stat" style="--i:${i}"><i>${x[0]}</i><b id="s${i}">0</b><span>${x[2]}</span></div>`).join('');S.forEach((x,i)=>first?countUp($('s'+i),x[1],x[3]):$('s'+i).textContent=x[3](x[1]));first=false;$('pc').textContent=pe.length;}
function draw(){if(!$('tabs').offsetParent&&$('tabs').style.display=='none')return;let h='';
 if(tab=='pay'){const pe=pays.filter(p=>p.status=='pending');h=pe.length?pe.map((p,i)=>`<div class="it" style="animation-delay:${i*70}ms"><div class="av">${ini(p.email)}</div><div class="m"><b>${naira(p.amount)} <span style="color:var(--g)">· suggest ${sug(p)}</span></b><small>${p.email}</small><small>from “${p.ref||'?'}” · ${ago(p.createdAt)}</small></div><div class="acts"><button class="btn s" onclick="ask1('${p.id}')">Approve</button><button class="btn s r" onclick="dec('${p.id}')">Reject</button></div></div>`).join(''):'<div class="empty">🎉 All caught up. No pending payments.</div>';}
 if(tab=='acc'){const l=users.filter(x=>(x.email||'').toLowerCase().includes(q));h=`<div class="sr"><input id="q" placeholder="Search accounts…" value="${q}"><button class="btn g s" onclick="csv()">Export CSV</button></div>`+(l.length?l.map((x,i)=>{const f=BF.left(x),pc=x.creditsGranted?Math.min(100,(x.paidUsed||0)/x.creditsGranted*100):0;return `<div class="it" style="animation-delay:${Math.min(i,10)*40}ms"><div class="av">${ini(x.email)}</div><div class="m"><b>${nm(x.email)}${x.blocked?' <span class="st x">suspended</span>':''}</b><small>${x.email}</small><div class="bar"><u style="width:${pc}%"></u></div><small>${f.free}/3 free · ${f.paid} paid left · joined ${ago(x.createdAt)}</small></div><div class="acts"><button class="btn g s" onclick="add('${x.id}')">+ Credits</button><button class="btn g s" onclick="sus('${x.id}',${!x.blocked})">${x.blocked?'Restore':'Suspend'}</button></div></div>`}).join(''):'<div class="empty">No accounts match.</div>');}
 if(tab=='his'){h=pays.filter(p=>p.status!='pending').map((p,i)=>`<div class="it" style="animation-delay:${Math.min(i,10)*40}ms"><div class="av">${ini(p.email)}</div><div class="m"><b>${naira(p.amount)}</b><small>${p.email}${p.status=='approved'?' · '+(p.cr||sug(p))+' receipts given':''} · ${ago(p.decidedAt||p.createdAt)}</small></div><span class="st ${p.status=='rejected'?'x':''}">${p.status}</span></div>`).join('')||'<div class="empty">Nothing yet.</div>';}
 $('v').innerHTML=h;const qi=$('q');if(qi)qi.oninput=()=>{q=qi.value.toLowerCase();const pos=qi.selectionStart;draw();const n=$('q');n.focus();n.setSelectionRange(pos,pos);};}
function ask(t,sb,def,fn,sg){$('mt').textContent=t;$('ms').textContent=sb;$('mi').value=def;cb=fn;
 $('mc').innerHTML=[...new Set([sg||def,10,50,100,250])].map(n=>`<button onclick="$('mi').value=${n}">${n}${n===sg?' · suggested':''}</button>`).join('');$('md').classList.add('on');setTimeout(()=>$('mi').select(),350);}
const close=()=>$('md').classList.remove('on');
$('mx').onclick=close;$('md').onclick=e=>{if(e.target.id=='md')close();};
$('mok').onclick=()=>{const n=parseInt($('mi').value);if(!n||n<1)return toast('Enter how many receipts');close();cb(n);};
function ask1(id){const p=pays.find(x=>x.id==id);if(!p||p.status!='pending')return;
 ask('Approve payment',naira(p.amount)+' from '+p.email,sug(p),async n=>{const b=BF.db.batch();
  b.update(BF.db.collection('payments').doc(id),{status:'approved',cr:n,decidedAt:ts()});b.update(BF.db.collection('users').doc(p.uid),{creditsGranted:inc(n)});
  try{await b.commit();confetti();toast('Approved · '+n+' receipts added ✓');}catch(e){toast('Failed: '+e.code);}},sug(p));}
async function dec(id){const p=pays.find(x=>x.id==id);if(!p||p.status!='pending'||!confirm('Reject '+naira(p.amount)+' from '+p.email+'?'))return;
 try{await BF.db.collection('payments').doc(id).update({status:'rejected',decidedAt:ts()});toast('Payment rejected');}catch(e){toast('Failed: '+e.code);}}
function add(uid){const x=users.find(y=>y.id==uid);ask('Add receipts',x?x.email:'',50,async n=>{try{await BF.db.collection('users').doc(uid).update({creditsGranted:inc(n)});toast('Added '+n+' receipts ✓');}catch(e){toast('Failed: '+e.code);}});}
async function sus(uid,v){try{await BF.db.collection('users').doc(uid).update({blocked:v});toast(v?'Account suspended':'Account restored');}catch(e){toast('Failed: '+e.code);}}
function csv(){const r=[['email','joined','credits_granted','credits_used','suspended']].concat(users.map(x=>[x.email,x.createdAt&&x.createdAt.toDate?x.createdAt.toDate().toISOString():'',x.creditsGranted||0,x.paidUsed||0,!!x.blocked]));
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([r.map(x=>x.join(',')).join('\n')],{type:'text/csv'}));a.download='bizflow-accounts.csv';a.click();}
$('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.t;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x==b));draw();};
</script></body></html>
